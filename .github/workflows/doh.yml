name: SnapDeploy DoH Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOH_URL: https://dns-93aca.containers.snapdeploy.app/dns-query?dns=AAABAAABAAAAAAAAB2V4YW1wbGUDY29tAAABAAE

jobs:
  doh:
    name: DoH GET check
    runs-on: ubuntu-latest

    steps:
      - name: Test DoH endpoint
        shell: bash
        run: |
          set -uo pipefail

          echo "Testing DoH endpoint:"
          echo "$DOH_URL"
          echo

          rm -f /tmp/doh-response
          rm -f /tmp/doh-headers
          rm -f /tmp/doh-error

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --location \
              --request GET \
              --header 'Accept: application/dns-message' \
              --user-agent 'GitHubActions-SnapDeploy-DoHCheck/1.0' \
              --dump-header /tmp/doh-headers \
              --output /tmp/doh-response \
              --write-out '%{http_code}' \
              "$DOH_URL" \
              2>/tmp/doh-error
          )"

          CURL_EXIT=$?

          echo "curl exit: ${CURL_EXIT}"
          echo "HTTP status: ${HTTP_CODE}"

          echo
          echo "===== Response headers ====="
          cat /tmp/doh-headers 2>/dev/null || true

          echo
          echo "===== Response size ====="
          wc -c /tmp/doh-response 2>/dev/null || true

          echo
          echo "===== DNS response (hex) ====="
          xxd -g 1 /tmp/doh-response 2>/dev/null | head -20 || true

          if [ -s /tmp/doh-error ]; then
            echo
            echo "===== curl error ====="
            cat /tmp/doh-error
          fi

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo
            echo "✗ curl request failed."
            exit "$CURL_EXIT"
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo
            echo "✗ DoH endpoint returned HTTP ${HTTP_CODE}."
            exit 1
          fi

          if [ ! -s /tmp/doh-response ]; then
            echo
            echo "✗ DoH endpoint returned an empty response."
            exit 1
          fi

          echo
          echo "✓ DoH GET request passed."
          echo "✓ Received a non-empty DNS response."
