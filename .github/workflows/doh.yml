name: Verify SnapDeploy DoH

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    

- name: Check SnapDeploy health
  shell: bash
  run: |
    set -euo pipefail

    URL="https://dns-93aca.containers.snapdeploy./healthz"

    for i in {1..12}; do
      echo "Health check $i/12"

      STATUS="$(curl -sS \
        --connect-timeout 10 \
        --max-time 20 \
        -A "GitHubActions-HealthCheck/1.0" \
        -o /tmp/health-body \
        -w '%{http_code}' \
        "$URL" || true)"

      BODY="$(cat /tmp/health-body 2>/dev/null || true)"

      echo "HTTP: $STATUS"
      echo "Body: $BODY"

      if [ "$STATUS" = "200" ] && [ "$BODY" = "ok" ]; then
        echo "Health check passed."
        exit 0
      fi

      sleep 10
    done

    echo "Health check failed."
    exit 1
