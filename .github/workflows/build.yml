name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from manifest
        id: version
        run: |
          echo "version=$(python3 -c 'import json; print(json.load(open(\"manifest.json\"))[\"version\"])')" >> "$GITHUB_OUTPUT"

      - name: Create zip
        run: |
          zip -r "bandwidth-guardian-${{ steps.version.outputs.version }}.zip" \
            manifest.json \
            defaults.js \
            service-worker.js \
            content.js \
            prehook.js \
            popup.html \
            popup.js \
            options.html \
            options.js \
            _locales \
            icons

      - name: Create tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: bandwidth-guardian-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
