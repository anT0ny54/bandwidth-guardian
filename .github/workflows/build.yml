name: Build and release
on:
  push:
    branches: [main]

# The whole workflow is one job, so a second push queues behind the in-flight
# release instead of cancelling it mid-gh-release-create (B11).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Single job: the release step consumes the zip from the same filesystem,
  # so the release can never fail with "Artifact not found" the way the old
  # build->release artifact handoff did.
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # C7: keep checkout version in sync with Keep-Alive.yml (both @v5).
      - uses: actions/checkout@v5

      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' manifest.json | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release-exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        # Invoke through bash: the executable bit is not preserved by zip
        # exports or some checkouts, which made "./build.sh" fail with 126.
        run: bash build.sh

      # Artifact upload is kept for humans (run downloads / debugging), but a
      # missing zip now fails the build HERE instead of surfacing later as a
      # confusing "Artifact not found" in another job (upload-artifact v4
      # defaults to silently warning when the path matches nothing).
      - uses: actions/upload-artifact@v4
        with:
          name: bandwidth-guardian-main
          path: bandwidth-guardian-main.zip
          if-no-files-found: error

      # B11: never clobber an existing release. The tag stays pinned to the
      # commit it was created from, keeping the release reproducible — cut a
      # new release by bumping manifest.json's version.
      - name: Create release
        if: steps.meta.outputs.release-exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "v$VERSION" bandwidth-guardian-main.zip \
            --title "v$VERSION" --generate-notes
