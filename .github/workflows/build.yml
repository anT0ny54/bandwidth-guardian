name: Build and Release

on:
  push:
    branches:
      - main
      
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read manifest version
        id: version
        shell: bash
        run: echo "version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Build extension
        run: bash ./build.sh --out ./dist

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandwidth-guardian-${{ steps.version.outputs.version }}
          path: dist/bandwidth-guardian-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *)
              echo "Release tag must start with v"
              exit 1
              ;;
          esac
          test "$TAG_VERSION" = "$MANIFEST_VERSION" || {
            echo "Tag v${TAG_VERSION} does not match manifest version ${MANIFEST_VERSION}"
            exit 1
          }

      - name: Build release ZIP
        run: bash ./build.sh --out ./dist

      - name: Publish manifest version release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          ZIP="dist/bandwidth-guardian-${VERSION}.zip"

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} exists; replacing release asset."
            gh release upload "v${VERSION}" "$ZIP" --clobber
          else
            echo "Creating v${VERSION} release."
            gh release create "v${VERSION}" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "Bandwidth Guardian v${VERSION}" \
              --generate-notes
          fi
