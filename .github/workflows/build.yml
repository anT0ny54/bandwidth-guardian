name: Build and release
on:
  push:
    branches: [main]

# B11: two quick pushes must not race gh release create/upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release-exists: ${{ steps.meta.outputs.release-exists }}
    steps:
      # C7: keep checkout version in sync with Keep-Alive.yml (both @v5).
      - uses: actions/checkout@v5
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' manifest.json | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release-exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bandwidth-guardian-main
          path: bandwidth-guardian-main.zip

  release:
    needs: build
    # B11: never clobber an existing release. The tag stays pinned to the
    # commit it was created from, keeping the release reproducible — cut a
    # new release by bumping manifest.json's version.
    if: needs.build.outputs.release-exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bandwidth-guardian-main
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" bandwidth-guardian-main.zip \
            --title "v$VERSION" --generate-notes
