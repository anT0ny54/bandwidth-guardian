name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v0.0.5
        run: bash ./build.sh --out ./dist

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandwidth-guardian-0.0.5
          path: dist/bandwidth-guardian-0.0.5.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release ZIP
        run: bash ./build.sh --out ./dist

      - name: Publish v0.0.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="dist/bandwidth-guardian-0.0.5.zip"

          if gh release view v0.0.5 >/dev/null 2>&1; then
            echo "Release v0.0.5 exists; replacing release asset."
            gh release upload v0.0.5 "$ZIP" --clobber
          else
            echo "Creating release v0.0.5."
            gh release create v0.0.5 "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "Bandwidth Guardian v0.0.5" \
              --generate-notes
          fi
