name: Keep Fork Alive

on:
  schedule:
    - cron: "17 3 1,15 * *"
  workflow_dispatch:

concurrency:
  group: keep-fork-alive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keep-alive:
    name: Create keep-alive commit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Update keep-alive file
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p .github

          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          printf 'Last kept alive on: %s\n' "$timestamp" \
            > .github/keep-alive.txt

      # R12: the old `git diff --cached --quiet` guard could never be true —
      # the timestamp always changes — so it is gone; the commit always runs.
      - name: Commit and push
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- .github/keep-alive.txt

          git commit \
            -m "chore: update repository keep-alive [skip ci]"

          git push origin "HEAD:${GITHUB_REF_NAME}"
