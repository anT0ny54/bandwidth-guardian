<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Bandwidth Guardian</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="wrap">
  <section class="card">
    <header class="header">
      <img class="shield" src="icons/icon-128.png" alt="Bandwidth Guardian" aria-hidden="true">
      <div class="header-copy">
        <h1 class="header-title">Bandwidth Guardian</h1>
        <p class="header-sub" id="headerSub">Loading…</p>
      </div>
    </header>

    <label class="toggle-row" for="enabled">
      <span class="toggle-copy">
        <span class="tr-label">Enable compression</span>
        <span class="tr-hint">Save image data through proxy</span>
      </span>
      <input type="checkbox" id="enabled" class="switch">
    </label>

    <div class="nudge" id="nudge" role="status">
      <span>Reload page to apply changes</span>
      <button class="nudge-btn" id="reloadBtn" type="button">Reload</button>
    </div>
  </section>

  <section class="card" id="ctrlCard">
    <label class="toggle-row" for="grayscale">
      <span class="toggle-copy">
        <span class="tr-label">Grayscale</span>
        <span class="tr-hint">Optional extra savings</span>
      </span>
      <input type="checkbox" id="grayscale" class="switch">
    </label>

    <h2 class="section-head">Quality</h2>
    <div class="presets" id="qualityPresets">
      <button class="preset" data-q="20" type="button">
        <span class="p-label">Small</span>
        <span class="p-hint">Maximum savings</span>
      </button>
      <button class="preset" data-q="40" type="button">
        <span class="p-label">Normal</span>
        <span class="p-hint">Balanced</span>
      </button>
      <button class="preset" data-q="80" type="button">
        <span class="p-label">Sharp</span>
        <span class="p-hint">Highest quality</span>
      </button>
    </div>
  </section>

  <section class="card site-card">
    <div class="site-row">
      <span aria-hidden="true">🌐</span>
      <span class="site-host" id="siteName">—</span>
      <span class="site-pill" id="sitePill" hidden></span>
    </div>
    <div class="btn-row">
      <button id="excludeBtn" class="btn" type="button">Skip this site</button>
    </div>
  </section>

  <div class="settings-action">
    <button id="settingsBtn" class="btn primary" type="button">⚙  Settings</button>
  </div>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
